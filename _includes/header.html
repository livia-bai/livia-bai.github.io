<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">
    <span class="brand-avatar">{% include avatar.html %}</span>
    <span class="brand-name">{{ site.title }}</span>
  </a>
  <nav class="nav">
    <a href="{{ '/' | relative_url }}" {% if page.nav == 'home' %}class="active"{% endif %}>
      <span lang="zh">首页</span><span lang="en">Home</span></a>
    <a href="{{ '/projects/' | relative_url }}" {% if page.nav == 'projects' %}class="active"{% endif %}>
      <span lang="zh">作品</span><span lang="en">Projects</span></a>
    <a href="{{ '/blog/' | relative_url }}" {% if page.nav == 'blog' or page.side == 'bright' %}class="active"{% endif %}>
      <span lang="zh">月之亮面</span><span lang="en">Bright Side</span></a>
    <a class="nav-dark{% if page.nav == 'dark' or page.side == 'dark' %} active{% endif %}" href="{{ '/dark-side/' | relative_url }}">
      <span lang="zh">月之暗面</span><span lang="en">Dark Side</span></a>
    <button class="lang-toggle" type="button" aria-label="切换语言 / Switch language">
      <span lang="zh">EN</span><span lang="en">中</span>
    </button>
    <button class="theme-toggle" type="button" aria-label="切换月之暗面 / 月之亮面" title="月之暗面 / 月之亮面">
      <svg class="moon-crescent" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/>
        <path d="M18 3l.6 1.4L20 5l-1.4.6L18 7l-.6-1.4L16 5l1.4-.6z" fill="currentColor" opacity=".7"/>
      </svg>
      <svg class="moon-full" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="8" fill="currentColor"/>
        <circle cx="9.3" cy="10" r="1.6" fill="#000" opacity=".13"/>
        <circle cx="14.6" cy="14.2" r="2.2" fill="#000" opacity=".13"/>
        <circle cx="14.4" cy="8.4" r="1" fill="#000" opacity=".13"/>
      </svg>
    </button>
  </nav>
</header>
