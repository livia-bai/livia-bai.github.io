{% if site.giscus.repo_id != "" and site.giscus.category_id != "" %}
<section class="comments card{% if page.side == 'dark' %} dark-side{% endif %}">
  <button class="comments-toggle" type="button" aria-expanded="false">
    <span class="section-title">💬 <span lang="zh">留言</span><span lang="en">Comments</span></span>
    <span class="comments-action">
      <span class="when-closed"><span lang="zh">展开</span><span lang="en">Show</span></span>
      <span class="when-open"><span lang="zh">收起</span><span lang="en">Hide</span></span>
      <span class="comments-chevron" aria-hidden="true">⌄</span>
    </span>
  </button>
  {% comment %} 点「展开」之后才去 GitHub 加载留言 {% endcomment %}
  <div class="comments-body"><div class="comments-inner">
    <p class="comments-loading"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span lang="zh">正在从月亮背面取信…</span><span lang="en">Fetching letters from the far side…</span></p>
  {% comment %} 中英两版共用一个讨论串：用 ref（没有就用网址）当作讨论的标题 {% endcomment %}
  <div class="giscus-mount"
       data-repo="{{ site.giscus.repo }}"
       data-repo-id="{{ site.giscus.repo_id }}"
       data-category="{{ site.giscus.category }}"
       data-category-id="{{ site.giscus.category_id }}"
       data-term="{{ page.ref | default: page.url }}"
       data-theme-bright="{{ '/assets/giscus/bright.css' | absolute_url }}"
       data-theme-dark="{{ '/assets/giscus/dark.css' | absolute_url }}"></div>
  </div></div>
</section>
{% endif %}
