# ========== 网站基本信息（改这里就行）==========
title: "Livia's Little Corner"
# 名字（中文 / 英文）
author:
  name_zh: "Livia"
  name_en: "Livia"
  avatar: "https://github.com/livia-bai.png"   # 和 GitHub 头像同步；也可以填表情如 "🌷"，或图片路径如 /assets/img/avatar.jpg
  tagline_zh: "喜欢做小东西、写点碎碎念的人"
  tagline_en: "I make little things and write little notes."
  bio_zh: "你好呀！这里是我的小角落，放着我做过的作品和平时写下的文字。欢迎随便逛逛～我住在月亮朝着你的这一面，那背面住着谁呢？点右上角的小月亮翻过去看看就知道啦。如果有什么让你笑了一下，记得在文章下面给我留个言哦 🌙"
  bio_en: "Hi there! This is my little corner of the internet, where I keep things I've made and words I've written. Make yourself at home~ I live on the side of the moon that faces you. Who lives on the other side? Tap the little moon up top and find out. And if anything here makes you smile, leave me a note under a post 🌙"
  email: ""               # 想公开邮箱就填上
  github: "livia-bai"     # 你的 GitHub 用户名

description: "Livia 的个人网站：作品集、月之亮面与月之暗面"
url: "https://livia-bai.github.io"
baseurl: ""

# 评论区（giscus，用 GitHub Discussions 存留言）。repo_id / category_id 填好后评论区才会出现
giscus:
  repo: "livia-bai/livia-bai.github.io"
  repo_id: "R_kgDOVTSfcg"
  category: "Announcements"
  category_id: "DIC_kwDOVTSfcs4DJWhh"

permalink: /blog/:year/:month/:day/:title/
markdown: kramdown
timezone: Asia/Singapore

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      side: bright
  # 月之暗面：dark/_posts/ 里的文章
  - scope:
      path: "dark"
      type: posts
    values:
      side: dark
      permalink: /dark-side/:year/:month/:day/:title/
