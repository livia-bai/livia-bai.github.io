# ⏰ 每天 12:30 和 22:30（新加坡时间）检查一次：这一档的月之暗面文章有没有发出来。
# 没有的话开一条 Issue @Livia 提醒她（GitHub 会发邮件），这条不会自动关掉。
name: 月之暗面 · 漏发提醒

on:
  schedule:
    # GitHub 用 UTC：04:30 / 14:30 UTC = 新加坡 12:30 / 22:30
    - cron: "30 4 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 看看最近 90 分钟里有没有新文章
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git log -1 --diff-filter=A --format=%ct -- 'dark/_posts/*.md')
          now=$(date +%s)
          age=$(( (now - ${last:-0}) / 60 ))
          echo "最近一篇是 $age 分钟前加的"
          if [ "$age" -le 90 ]; then
            echo "按时更新了 ✅"
            exit 0
          fi
          slot=$(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M')
          gh label create "月之暗面" --color 6a5f86 --description "月之暗面的新文章通知" --force >/dev/null
          body=$(printf '%s\n\n%s' \
            "@livia-bai 到 $slot（新加坡时间）为止，月之暗面已经 $age 分钟没有新文章了，这一档的定时任务可能没跑成功。" \
            "可以去 https://claude.ai/code 的定时任务里看看「月之暗面 · 每日两篇」最近一次的运行记录，或者回到搭网站的那个对话里问一下。")
          gh issue create --label "月之暗面" --title "⚠️ 月之暗面这一档没有更新（$slot）" --body "$body"
