# 🌑 月之暗面有新文章时：等它在网站上能打开了，开一条 Issue @Livia，GitHub 会发邮件通知她。
# Issue 发完就自动关掉，不会堆在仓库里。
# 想测试一下：在仓库的 Actions 页面选这个 workflow，点 Run workflow，会拿最新一篇发一封「🧪 测试通知」。
name: 月之暗面 · 新文章通知

on:
  push:
    branches: [main]
    paths:
      - "dark/_posts/**"
  # 在仓库的 Actions 页面手动点 Run workflow，也会拿最新一篇发一封测试通知
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 找出这次新加的文章
        id: find
        run: |
          before="${{ github.event.before }}"
          if git cat-file -e "$before" 2>/dev/null; then
            added=$(git diff --name-only --diff-filter=A "$before" "$GITHUB_SHA" -- 'dark/_posts/*.md' | grep -v -- '-en\.md$' || true)
          fi
          test=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            added=$(ls dark/_posts/*.md | grep -v -- '-en\.md$' | sort | tail -n 1)
            test=true
          fi
          echo "test=$test" >> "$GITHUB_OUTPUT"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$added" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "新文章：$added"

      - name: 等文章上线，再发通知
        if: steps.find.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ steps.find.outputs.files }}
          IS_TEST: ${{ steps.find.outputs.test }}
        run: |
          gh label create "月之暗面" --color 6a5f86 --description "月之暗面的新文章通知" --force >/dev/null
          for f in $FILES; do
            eval "$(python3 .github/scripts/post_info.py "$f")"
            echo "标题：$title  链接：$url"

            # GitHub Pages 部署要几分钟，最多等 25 分钟
            live=false
            for i in $(seq 1 50); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url?r=$RANDOM")
              if [ "$code" = "200" ]; then live=true; break; fi
              sleep 30
            done

            prefix="🌑 月之暗面新文章"
            [ "$IS_TEST" = "true" ] && prefix="🧪 测试通知"
            if [ "$live" = "true" ]; then
              status="已经上线啦，点开就能读 👉 $url"
            else
              status="⚠️ 已经推送，但 25 分钟内网站还没更新出来，稍后再打开看看：$url"
            fi

            body=$(printf '%s\n\n> %s\n\n%s\n\n<sub>这是自动发的通知，发完会自动关掉。打开文章会自动翻到月之暗面。</sub>' \
              "@livia-bai 月亮背面多了一篇：**$title**" "$excerpt" "$status")
            if [ "$IS_TEST" = "true" ]; then
              body=$(printf '%s\n\n%s' "$body" "<sub>（这是新文章通知功能的测试，用的是目前最新的一篇。）</sub>")
            fi

            issue=$(gh issue create --title "$prefix：$title" --body "$body" --label "月之暗面")
            echo "已发通知：$issue"
            gh issue close "$issue" >/dev/null
          done
