<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 150 }}">
  {% if site.author.avatar contains '/' %}<link rel="icon" href="{% if site.author.avatar contains '://' %}{{ site.author.avatar }}{% else %}{{ site.author.avatar | relative_url }}{% endif %}">
  {% else %}<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>{{ site.author.avatar }}</text></svg>">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    // 尽早读取上次选择的语言，避免页面闪一下
    try {
      var l = localStorage.getItem('lang');
      if (!l) l = (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
      document.documentElement.setAttribute('data-lang', l);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div><div class="blob b5"></div>
    <span class="spark" style="--x:6%;--y:12%;--s:24px;--d:0s">♥&#xFE0E;</span>
    <span class="spark" style="--x:90%;--y:8%;--s:22px;--d:1.2s">✦</span>
    <span class="spark" style="--x:20%;--y:40%;--s:18px;--d:2.4s">✿</span>
    <span class="spark" style="--x:95%;--y:34%;--s:16px;--d:0.6s">♥&#xFE0E;</span>
    <span class="spark" style="--x:3%;--y:68%;--s:18px;--d:3s">✦</span>
    <span class="spark" style="--x:74%;--y:58%;--s:14px;--d:1.8s">♥&#xFE0E;</span>
    <span class="spark" style="--x:46%;--y:6%;--s:22px;--d:2s">✧</span>
    <span class="spark" style="--x:62%;--y:90%;--s:18px;--d:0.3s">✿</span>
    <span class="spark" style="--x:30%;--y:88%;--s:18px;--d:2.8s">♥&#xFE0E;</span>
    <span class="spark" style="--x:84%;--y:78%;--s:14px;--d:1.5s">✦</span>
    <span class="spark" style="--x:14%;--y:26%;--s:14px;--d:3.4s">✧</span>
    <span class="spark" style="--x:56%;--y:30%;--s:12px;--d:1s">♥&#xFE0E;</span>
    <span class="spark" style="--x:38%;--y:64%;--s:12px;--d:2.2s">✦</span>
    <span class="spark" style="--x:92%;--y:56%;--s:14px;--d:3.8s">✿</span>
    <span class="spark emoji" style="--x:82%;--y:20%;--s:26px;--d:0.8s">🎀</span>
    <span class="spark emoji" style="--x:10%;--y:84%;--s:22px;--d:2.6s">🎀</span>
  </div>
  {% include header.html %}
  <main class="container">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
